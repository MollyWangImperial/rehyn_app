<style>
body.testing-mouth #stage{width:calc(100vw - 330px)}
#mouthDiagnostics{position:absolute;left:100%;top:0;width:330px;height:100%;padding:18px;background:#102d29;color:#edf7f2;overflow:auto;z-index:12;font-size:14px;line-height:1.45}
#mouthDiagnostics h2{font-size:21px;margin-bottom:8px}#mouthDiagnostics h3{font-size:16px;margin:14px 0 6px}
#mouthDiagnostics .mouthMetric{padding:10px 0;border-bottom:1px solid #47635c}#mouthDiagnostics b,#mouthDiagnostics small{display:block}#mouthDiagnostics strong{font-size:23px}#mouthDiagnostics small{color:#c4d8d0;font-size:12px}
#mouthDiagnostics button{min-height:42px;margin:8px 4px 0 0;padding:8px;border:1px solid #9fc4b5;border-radius:8px;background:#245c4a;color:white;cursor:pointer}
#mouthDiagnostics input{margin:8px 6px 8px 0}#mouthCaption{margin-top:10px;color:#e8f4ee}
body.testing-mouth #bottom,body.testing-mouth #assessmentQualityStatus,body.testing-mouth #lapStatus{display:none!important}
body.testing-mouth #testingReachAngles{display:none!important}
@media(max-width:760px){body.testing-mouth #stage{width:100vw;height:60vh;height:60dvh}#mouthDiagnostics{left:0;top:100%;width:100%;height:40vh;height:40dvh;padding:12px 16px}#mouthDiagnostics h2{font-size:18px}#mouthMetrics,#mouthCompensations{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}body.testing-mouth #calibrationOverlay{padding:10px}body.testing-mouth #calibrationCard{max-height:95%;overflow:auto}}
</style>
<aside id="mouthDiagnostics" class="hidden" aria-label="Hand to Mouth live measurements">
  <h2>Hand to Mouth · Testing</h2>
  <div id="mouthStep">Finding your seated position</div>
  <label><input type="checkbox" id="mouthVoiceOn" checked>Molly voice guidance</label>
  <div id="mouthVoiceState" role="status"></div>
  <div id="mouthCaption"></div>
  <div id="mouthHold">Calibration in progress</div>
  <h3>Scoring measurements</h3><div id="mouthMetrics"></div>
  <div id="mouthAngles" class="mouthMetric"></div>
  <h3>Compensation checks</h3><div id="mouthCompensations"></div>
  <small>Arm elevation uses model 3D; its cyan arc is a separate 2D view. Yellow elbow bend arc uses the scoring angle. The head cue is a proxy, not an anatomical angle.</small>
  <label><input id="mouthAssisted" type="checkbox">Someone is physically helping my arm</label>
  <button id="mouthSkip" type="button">Skip step</button>
</aside>
