services:
  - type: web
    name: rehyn
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/db
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: rehyn
      - key: ALLOW_EPHEMERAL_PATIENT_STATE
        value: "0"
      - key: REHYN_TRIAL_ACCESS_CODE
        sync: false
      - key: REHYN_ENFORCE_TRIAL_CODE
        value: "1"
      - key: OPENAI_API_KEY
        sync: false
      - key: TTS_VOICE
        value: nova
      - key: TTS_MODEL
        value: tts-1
      - key: INSTRUCTION_TTS_PROVIDER
        value: elevenlabs
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: WeMiVLMEQeVXN5PFqfo3
      - key: ELEVENLABS_VOICE_SCOPE
        value: all
      - key: ELEVENLABS_TTS_MODEL
        value: eleven_multilingual_v2
      - key: ELEVENLABS_OUTPUT_FORMAT
        value: mp3_44100_128
      - key: ALIRA_REALTIME_MODEL
        value: gpt-realtime-2.1
      - key: ALIRA_REALTIME_VOICE
        value: marin
      - key: LOCAL_GPU_WORKER_URL
        sync: false
      - key: LOCAL_BACKEND_CALLBACK_URL
        value: https://rehyn.onrender.com/api
      - key: ANALYSIS_WORKER_TOKEN
        sync: false
      - key: ANALYSIS_WORKER_CF_CLIENT_ID
        sync: false
      - key: ANALYSIS_WORKER_CF_CLIENT_SECRET
        sync: false
      - key: CLINICAL_REVIEW_APPROVER_IDS
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
